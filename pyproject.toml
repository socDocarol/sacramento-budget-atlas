[project]
name = "sacramento-budget-shiny"
version = "0.1.0"
description = "Internal City of Sacramento approved budget data story and analysis pilot."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anywidget==0.9.18",
  "faicons>=0.2.2,<0.3",
  "httpx==0.28.1",
  "numpy==2.4.2",
  "pandas==3.0.1",
  "plotly==6.5.2",
  "pyarrow>=20,<22",
  "shiny==1.7.0",
  "shinywidgets==0.8.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio>=1.1,<2",
  "pytest-playwright>=0.7,<0.8",
  "pytest-xdist>=3.8,<4",
  "respx>=0.22,<0.23",
  "ruff>=0.12,<0.15",
]

[tool.pytest.ini_options]
addopts = '-q -m "not live and not e2e"'
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
  "live: requires access to the public ArcGIS service",
  "e2e: launches the Shiny application in a browser",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
