services:
  budget-shiny:
    build:
      context: .
      pull: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      BUDGET_CACHE_DIR: /var/cache/sacramento-budget
      BUDGET_CACHE_TTL_SECONDS: "86400"
      LOG_LEVEL: INFO
      APP_BASE_PATH: /
    volumes:
      - budget-cache:/var/cache/sacramento-budget
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777,nodev,nosuid,noexec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

volumes:
  budget-cache:
